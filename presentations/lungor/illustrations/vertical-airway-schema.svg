<text class="note" x="75" y="900">Utsnitt med cilierade celler. Slem bildas av bägarceller och körtlar, som inte visas här.</text>
<text class="note" x="75" y="935">Ciliernas arbete flyttar slemmet. Riktningen styrs inte av tyngdkraften.</text>
<text class="note" x="75" y="970">Förenklad modell, olika förstoringar. Alveoler har inte detta cilierade epitel.</text>
