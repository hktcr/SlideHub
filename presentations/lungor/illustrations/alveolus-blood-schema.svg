<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><title>En alveol, en kapillär och röda blodkroppar</title><desc>Vänster en alveol i öppnat snitt med en kapillär utanför luftutrymmet och flera röda blodkroppar inne i kärlet. Höger en starkt förstorad röd blodkropp separat, sedd uppifrån och i genomskärning. Modellerna är inte skalenliga.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#507779"/></marker><radialGradient id="disc"><stop offset="0" stop-color="#e7a99b"/><stop offset=".44" stop-color="#d99584"/><stop offset=".7" stop-color="#a94e47"/><stop offset="1" stop-color="#c87562"/></radialGradient></defs><rect width="1600" height="1000" fill="#fffefa"/><style>text{font-family:Arial,sans-serif;fill:#20211e}.title{font-family:Georgia,serif;font-size:42px;font-weight:bold}.label{font-size:29px}.small{font-size:24px}.note{font-size:22px;fill:#575d51}.leader{fill:none;stroke:#20211e;stroke-width:2}.wall{fill:#fffefa;stroke:#20211e;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style>
<text class="title" x="75" y="80">Luft och blod hålls åtskilda</text>
<text class="small" x="75" y="125">Öppnad alveol och en utvald kapillär, inte hela kärlnätet</text>
