<text class="small" x="1210" y="595" text-anchor="middle">Tunnare mitt, inget hål</text>
<text class="small" x="1210" y="685" text-anchor="middle">Samma cell i genomskärning</text>
<path d="M1070 752 C1070 713 1110 708 1147 725 C1190 744 1230 744 1273 725 C1310 708 1350 713 1350 752 C1350 790 1310 795 1273 778 C1230 760 1190 760 1147 778 C1110 795 1070 790 1070 752 Z" fill="#b55d50" stroke="#20211e" stroke-width="3"/>
<text class="note" x="75" y="930">Två olika förstoringar. Färger och storlekar är förenklade, inte uppmätta.</text>
<text class="note" x="75" y="965">Röda blodkroppar finns i blodkärlen, inte i alveolens luftutrymme.</text>
