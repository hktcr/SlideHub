<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideCast — Följ presentationen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --surface: #14141f;
            --card: #1c1c2e;
            --text: #f0f0f5;
            --text-muted: rgba(240, 240, 245, 0.6);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #22c55e;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== CONNECTION STATES ===== */
        .connection-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            z-index: 100;
            transition: background 0.5s;
        }
        .connection-bar.connected { background: var(--success); }
        .connection-bar.connecting { 
            background: linear-gradient(90deg, var(--accent), transparent);
            animation: pulse 1.5s ease infinite;
        }
        .connection-bar.disconnected { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ===== CASCADING ENTRANCE ANIMATIONS ===== */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes typeIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes numberRoll {
            0% { opacity: 0; transform: translateY(40px) scale(0.5); }
            60% { transform: translateY(-6px) scale(1.05); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(249,115,22,0.3); }
            50% { text-shadow: 0 0 40px rgba(249,115,22,0.6), 0 0 80px rgba(249,115,22,0.2); }
        }
        @keyframes accentShimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .anim-cascade > * {
            opacity: 0;
            animation: slideUp 0.5s ease forwards;
        }
        .anim-cascade > *:nth-child(1) { animation-delay: 0.1s; }
        .anim-cascade > *:nth-child(2) { animation-delay: 0.3s; }
        .anim-cascade > *:nth-child(3) { animation-delay: 0.5s; }
        .anim-cascade > *:nth-child(4) { animation-delay: 0.7s; }

        .anim-stat-value {
            animation: numberRoll 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
            opacity: 0;
        }
        .anim-stat-value.pulsing {
            animation: numberRoll 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards,
                       glowPulse 3s ease-in-out 1.2s infinite;
        }
        .anim-badge {
            animation: scaleIn 0.4s ease 0.05s forwards;
            opacity: 0;
        }
        .anim-title {
            animation: slideUp 0.6s ease 0.2s forwards;
            opacity: 0;
        }
        .anim-subtitle {
            animation: slideUp 0.5s ease 0.45s forwards;
            opacity: 0;
        }
        .anim-quote {
            animation: typeIn 0.8s ease 0.3s forwards;
            opacity: 0;
        }
        .anim-author {
            animation: slideUp 0.4s ease 0.9s forwards;
            opacity: 0;
        }
        .anim-shimmer {
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
            background-size: 200% 100%;
            animation: accentShimmer 3s ease-in-out infinite;
        }

        /* ===== JOIN SCREEN ===== */
        .join-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.5s, transform 0.5s;
        }
        .join-screen.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .join-logo {
            font-size: 3rem;
            animation: float 3s ease-in-out infinite;
        }
        .join-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .join-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: -1rem;
        }
        .join-code-input {
            width: 280px;
            padding: 1rem 1.5rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
            text-align: center;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.3s;
        }
        .join-code-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }
        .join-code-input::placeholder {
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.2em;
            font-size: 1.2rem;
        }
        .join-btn {
            padding: 0.9rem 2.5rem;
            background: var(--accent);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .join-btn:hover { background: #4f46e5; transform: translateY(-2px); }
        .join-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .join-error {
            color: #ef4444;
            font-size: 0.9rem;
            min-height: 1.4rem;
        }
        .join-or {
            color: var(--text-muted);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .join-or::before, .join-or::after {
            content: '';
            width: 40px;
            height: 1px;
            background: var(--border);
        }
        .join-direct-link {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: underline;
            cursor: pointer;
        }
        .join-direct-link:hover { color: var(--text); }

        /* ===== HEADER ===== */
        .header {
            padding: 1.5rem 1.5rem 1rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .header .presentation-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 0.3rem;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-counter {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.8rem;
            padding: 0.4rem 1rem;
            background: var(--surface);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .slide-counter .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: livePulse 2s ease infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 0.4; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== SLIDE DISPLAY ===== */
        .slide-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .slide-frame {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide-frame.transitioning {
            transform: scale(0.97);
            opacity: 0.7;
        }

        .slide-content-mirror {
            padding: 2rem;
            text-align: center;
            width: 100%;
        }

        .slide-content-mirror h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .slide-content-mirror .slide-subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: var(--text-muted);
        }

        .slide-content-mirror .slide-type-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .slide-content-mirror .stat-value {
            font-size: clamp(4rem, 12vw, 8rem);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #fcd34d, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slide-content-mirror .quote-text {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            line-height: 1.6;
            font-style: italic;
            max-width: 700px;
            margin: 0 auto;
        }

        .slide-content-mirror .quote-author {
            margin-top: 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ===== WAITING STATE ===== */
        .waiting-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .waiting-state .waiting-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .waiting-state h2 {
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
        }

        .waiting-state p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ===== QUESTION INPUT ===== */
        .question-section {
            padding: 1rem 1.5rem 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .question-form {
            display: flex;
            gap: 0.5rem;
        }

        .question-input {
            flex: 1;
            padding: 0.8rem 1.2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .question-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .question-input::placeholder {
            color: var(--text-muted);
        }

        .question-submit {
            padding: 0.8rem 1.5rem;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .question-submit:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        .question-submit:active {
            transform: translateY(0);
        }

        .question-submit.sent {
            background: var(--success);
        }

        .question-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* ===== POLL AREA ===== */
        .poll-area {
            display: none;
            padding: 1rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .poll-area.active {
            display: block;
        }

        .poll-question {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }

        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .poll-option {
            padding: 1rem 1.2rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1rem;
        }

        .poll-option:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
        }

        .poll-option.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }

        .poll-option .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .poll-option.selected .option-letter {
            background: var(--accent);
            color: white;
        }

        /* ===== DRILL QUIZ (audience side) ===== */
        .drill-area {
            display: none;
            padding: 1rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .drill-area.active { display: block; }

        .drill-header {
            text-align: center;
            margin-bottom: 1rem;
        }
        .drill-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #86efac;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
        }
        .drill-question-text {
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.8rem;
        }
        .drill-timer-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        .drill-timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #6366f1, #22c55e);
            border-radius: 2px;
            transition: width 1s linear;
        }

        .drill-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .drill-option {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 1.2rem;
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 1rem;
        }
        .drill-option:hover {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.05);
            transform: translateX(4px);
        }
        .drill-option.selected {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.1);
        }
        .drill-option.correct {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, 0.12) !important;
        }
        .drill-option.wrong {
            opacity: 0.35;
            border-color: rgba(255,255,255,0.05);
        }
        .drill-option .drill-letter {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            flex-shrink: 0;
            color: white;
        }
        .drill-option.selected .drill-letter {
            background: var(--accent) !important;
        }
        .drill-option.correct .drill-letter {
            background: #22c55e !important;
        }

        .drill-feedback {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(34, 197, 94, 0.08);
            border-left: 3px solid #22c55e;
            border-radius: 0 10px 10px 0;
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: left;
            animation: drillFadeIn 0.4s ease;
        }
        @keyframes drillFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .drill-status {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .drill-status.sent { color: var(--success); }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.5;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .slide-frame { aspect-ratio: auto; min-height: 40vh; overflow: visible; border-radius: 12px; }
            .header { padding: 1rem; }
            .question-section { padding: 1rem; }
        }
    </style>
</head>
<body>
    <!-- JOIN SCREEN -->
    <div class="join-screen" id="joinScreen">
        <div class="join-logo">📡</div>
        <div class="join-title">SlideCast</div>
        <div class="join-subtitle">Ange kod för att gå med i presentationen</div>
        <input type="text" class="join-code-input" id="joinCodeInput" 
               placeholder="KOD" maxlength="6" autocomplete="off" autofocus
               oninput="this.value=this.value.toUpperCase()">
        <button class="join-btn" id="joinBtn" onclick="joinWithCode()">Gå med</button>
        <div class="join-error" id="joinError"></div>
        <div class="join-or">eller</div>
        <div class="join-direct-link" onclick="skipJoinScreen()">Anslut via direktlänk</div>
    </div>

    <div class="connection-bar connecting" id="connectionBar"></div>

    <header class="header">
        <h1>SlideCast</h1>
        <div class="presentation-title" id="presentationTitle">Ansluter...</div>
        <div class="slide-counter" id="slideCounter" style="display:none">
            <span class="live-dot"></span>
            <span id="slideProgress">—</span>
        </div>
    </header>

    <main class="slide-area">
        <div class="slide-frame" id="slideFrame">
            <div class="waiting-state" id="waitingState">
                <div class="waiting-icon">📡</div>
                <h2>Väntar på presentatören</h2>
                <p>Presentationen visas här automatiskt</p>
            </div>
            <div class="slide-content-mirror" id="slideContentMirror" style="display:none"></div>
        </div>
    </main>

    <div class="poll-area" id="pollArea">
        <div class="poll-question" id="pollQuestion"></div>
        <div class="poll-options" id="pollOptions"></div>
    </div>

    <div class="drill-area" id="drillArea">
        <div class="drill-header">
            <div class="drill-badge">🧠 QUIZ</div>
            <div class="drill-question-text" id="drillQuestionText"></div>
        </div>
        <div class="drill-timer-bar"><div class="drill-timer-fill" id="drillTimerFill"></div></div>
        <div class="drill-options" id="drillOptions"></div>
        <div class="drill-feedback" id="drillFeedback" style="display:none"></div>
        <div class="drill-status" id="drillStatus"></div>
    </div>

    <section class="question-section">
        <div class="question-label">💬 Ställ en fråga till presentatören</div>
        <form class="question-form" id="questionForm" onsubmit="submitQuestion(event)">
            <input type="text" class="question-input" id="questionInput" 
                   placeholder="Skriv din fråga här..." autocomplete="off">
            <button type="submit" class="question-submit" id="questionBtn">Skicka</button>
        </form>
    </section>

    <footer class="footer">
        SlideCraft · Powered by gAIa 🌲
    </footer>

    <script src="component-forge.js"></script>
    <script>
        // Density management (Fas 6)
        function updateDensity() {
            const isHandheld = window.innerWidth < 700;
            document.documentElement.classList.toggle('sf-density-handheld', isHandheld);
            if (window.SlideForge) {
                window.SlideForge.density = isHandheld ? 'handheld' : 'stage';
            }
        }
        window.addEventListener('resize', updateDensity);
        updateDensity();
        /**
         * SlideCast Watch Client v1.0
         * 
         * Connects to a relay server via Server-Sent Events (SSE) or WebSocket
         * to receive real-time slide updates and send audience questions.
         * 
         * Connection modes (auto-detected):
         * 1. WebSocket (preferred for bidirectional)
         * 2. SSE + HTTP POST fallback
         * 3. Polling fallback (for restrictive networks)
         */

        const CONFIG = {
            // Relay URL — set via ?relay= URL parameter or default
            relayUrl: null,
            roomId: null,
            reconnectInterval: 3000,
            maxReconnectAttempts: 20
        };

        let ws = null;
        let reconnectAttempts = 0;
        let currentSlide = null;

        // ===== INITIALIZATION =====
        function init() {
            const params = new URLSearchParams(window.location.search);
            CONFIG.relayUrl = params.get('relay') || window.location.origin;
            CONFIG.roomId = params.get('room') || 'default';

            document.getElementById('presentationTitle').textContent = 
                params.get('title') || 'Presentation';

            connect();
        }

        // ===== CONNECTION =====
        function connect() {
            updateConnectionState('connecting');

            // Try WebSocket first
            const wsUrl = CONFIG.relayUrl.replace(/^http/, 'ws') + '/ws/' + CONFIG.roomId;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    reconnectAttempts = 0;
                    updateConnectionState('connected');
                    ws.send(JSON.stringify({ type: 'join', role: 'audience' }));
                };

                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        handleMessage(msg);
                    } catch (e) {
                        console.warn('Invalid message:', event.data);
                    }
                };

                ws.onclose = () => {
                    updateConnectionState('disconnected');
                    scheduleReconnect();
                };

                ws.onerror = () => {
                    // WebSocket failed, try SSE fallback
                    console.log('WebSocket failed, trying SSE...');
                    ws = null;
                    connectSSE();
                };
            } catch (e) {
                connectSSE();
            }
        }

        function connectSSE() {
            const sseUrl = CONFIG.relayUrl + '/events/' + CONFIG.roomId;
            
            try {
                const eventSource = new EventSource(sseUrl);
                
                eventSource.onopen = () => {
                    reconnectAttempts = 0;
                    updateConnectionState('connected');
                };

                eventSource.onmessage = (event) => {
                    try {
                        handleMessage(JSON.parse(event.data));
                    } catch (e) {}
                };

                eventSource.onerror = () => {
                    updateConnectionState('disconnected');
                    eventSource.close();
                    scheduleReconnect();
                };
            } catch (e) {
                // Fallback to polling
                startPolling();
            }
        }

        function startPolling() {
            setInterval(async () => {
                try {
                    const resp = await fetch(CONFIG.relayUrl + '/state/' + CONFIG.roomId);
                    if (resp.ok) {
                        const data = await resp.json();
                        updateConnectionState('connected');
                        handleMessage(data);
                    }
                } catch (e) {
                    updateConnectionState('disconnected');
                }
            }, 2000);
        }

        function scheduleReconnect() {
            if (reconnectAttempts < CONFIG.maxReconnectAttempts) {
                reconnectAttempts++;
                setTimeout(connect, CONFIG.reconnectInterval);
            }
        }

        function updateConnectionState(state) {
            const bar = document.getElementById('connectionBar');
            bar.className = 'connection-bar ' + state;
        }

        // ===== MESSAGE HANDLING =====
        let drillTimer = null;
        let drillAnswered = false;
        const participantId = 'p-' + Math.random().toString(36).substr(2, 8);

        function handleMessage(msg) {
            switch (msg.type) {
                case 'slide':
                    renderSlide(msg.data);
                    hideDrill(); // hide drill when slide changes
                    break;
                case 'poll':
                    showPoll(msg.data);
                    break;
                case 'poll_end':
                    hidePoll();
                    break;
                case 'drill':
                    handleDrill(msg);
                    break;
                case 'meta':
                    updateMeta(msg.data);
                    break;
                case 'state':
                    // Full state sync
                    if (msg.data.slide) renderSlide(msg.data.slide);
                    if (msg.data.meta) updateMeta(msg.data.meta);
                    if (msg.data.poll) showPoll(msg.data.poll);
                    break;
            }
        }

        // ===== DRILL SYNC (audience side) =====
        function handleDrill(msg) {
            switch (msg.action) {
                case 'question':
                    showDrillQuestion(msg.data);
                    break;
                case 'reveal':
                    revealDrillAnswer(msg.data);
                    break;
                case 'next':
                    // Reset for next question
                    drillAnswered = false;
                    break;
                case 'results':
                    showDrillResults(msg.data);
                    break;
            }
        }

        function showDrillQuestion(data) {
            const area = document.getElementById('drillArea');
            const qText = document.getElementById('drillQuestionText');
            const options = document.getElementById('drillOptions');
            const feedback = document.getElementById('drillFeedback');
            const status = document.getElementById('drillStatus');

            drillAnswered = false;
            feedback.style.display = 'none';
            status.textContent = '';
            status.className = 'drill-status';

            const colors = ['#6366f1', '#22c55e', '#f97316', '#ef4444', '#eab308', '#a855f7'];

            qText.textContent = data.question;
            options.innerHTML = data.options.map((opt, i) => `
                <div class="drill-option" onclick="answerDrill('${data.quizId}', ${data.questionIdx}, ${i}, this)">
                    <span class="drill-letter" style="background:${colors[i % colors.length]}">${String.fromCharCode(65 + i)}</span>
                    <span>${opt}</span>
                </div>
            `).join('');

            area.classList.add('active');

            // Start timer
            if (data.timeLimit) {
                startDrillTimer(data.timeLimit);
            }
        }

        function answerDrill(quizId, questionIdx, optIdx, el) {
            if (drillAnswered) return;
            drillAnswered = true;

            // Visual: mark selected
            document.querySelectorAll('.drill-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');

            // Send answer to relay
            sendToRelay({
                type: 'drill_answer',
                participantId: participantId,
                quizId: quizId,
                questionIdx: questionIdx,
                option: optIdx,
                time: Date.now()
            });

            const status = document.getElementById('drillStatus');
            status.textContent = '✓ Svar registrerat!';
            status.className = 'drill-status sent';
        }
        // Make it global for onclick
        window.answerDrill = answerDrill;

        function revealDrillAnswer(data) {
            if (drillTimer) clearInterval(drillTimer);

            const correctIdx = data.correct;
            document.querySelectorAll('.drill-option').forEach((el, i) => {
                if (i === correctIdx) {
                    el.classList.add('correct');
                } else {
                    el.classList.add('wrong');
                }
            });

            if (data.explanation) {
                const feedback = document.getElementById('drillFeedback');
                feedback.innerHTML = `<strong>💡</strong> ${data.explanation}`;
                feedback.style.display = 'block';
            }
        }

        function showDrillResults(data) {
            const area = document.getElementById('drillArea');
            const drillOptions = document.getElementById('drillOptions');
            const qText = document.getElementById('drillQuestionText');

            qText.textContent = '🏆 Resultat';
            drillOptions.innerHTML = (data.results || []).map((r, i) => `
                <div style="display:flex;align-items:center;gap:0.8rem;padding:0.6rem;opacity:0.8">
                    <span style="min-width:1.5rem;font-weight:700;opacity:0.5">${i+1}.</span>
                    <span style="flex:1;font-size:0.85rem">${r.question.substring(0,50)}${r.question.length>50?'...':''}</span>
                    <span style="font-weight:700;color:${r.pct>=70?'#22c55e':r.pct>=40?'#eab308':'#ef4444'}">${r.pct}%</span>
                </div>
            `).join('');
        }

        function hideDrill() {
            document.getElementById('drillArea').classList.remove('active');
            if (drillTimer) clearInterval(drillTimer);
        }

        function startDrillTimer(seconds) {
            if (drillTimer) clearInterval(drillTimer);
            let remaining = seconds;
            const fill = document.getElementById('drillTimerFill');

            drillTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(drillTimer);
                    if (fill) fill.style.width = '0%';
                    return;
                }
                if (fill) fill.style.width = ((remaining / seconds) * 100) + '%';
            }, 1000);
        }

        // ===== SLIDE RENDERING =====
        function renderSlide(data) {
            if (!data) return;
            currentSlide = data;

            const frame = document.getElementById('slideFrame');
            const waiting = document.getElementById('waitingState');
            const mirror = document.getElementById('slideContentMirror');
            const counter = document.getElementById('slideCounter');

            // Transition animation
            frame.classList.add('transitioning');
            
            setTimeout(() => {
                waiting.style.display = 'none';
                mirror.style.display = 'block';
                counter.style.display = 'inline-flex';

                // Update slide counter
                document.getElementById('slideProgress').textContent = 
                    `Slide ${data.index + 1} av ${data.total}`;

                // Render slide content based on type
                mirror.innerHTML = renderSlideContent(data);

                frame.classList.remove('transitioning');
            }, 200);
        }

        function renderSlideContent(data) {
            const s = data.slide || data;
            
            switch (s.type) {
                case 'title':
                    return `
                        <div class="anim-cascade">
                            <div class="slide-type-badge anim-badge">Presentation</div>
                            <h2 class="anim-title">${s.title || ''}</h2>
                            <div class="slide-subtitle anim-subtitle">${s.subtitle || ''}</div>
                        </div>
                    `;

                case 'stat':
                    return `
                        <div class="anim-cascade">
                            <div class="stat-value anim-stat-value pulsing">${s.value || ''}</div>
                            <h2 class="anim-subtitle">${s.label || ''}</h2>
                        </div>
                    `;

                case 'quote':
                    const quoteText = (s.text || '').replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
                    return `
                        <div>
                            <div class="quote-text anim-quote">"${quoteText}"</div>
                            ${s.author ? `<div class="quote-author anim-author">— ${s.author}</div>` : ''}
                        </div>
                    `;

                case 'presenter':
                    return `
                        <div class="anim-cascade">
                            <div class="slide-type-badge anim-badge">Presentatör</div>
                            <h2 class="anim-title">${s.name || ''}</h2>
                            <div class="slide-subtitle anim-subtitle">${s.title || ''} · ${s.org || ''}</div>
                        </div>
                    `;

                case 'grid':
                    const cardTitles = (s.cards || []).map((c, i) => 
                        `<span style="opacity:0;animation:slideUp 0.4s ease ${0.3 + i*0.15}s forwards;display:inline-block;margin:0.3rem;padding:0.3rem 0.8rem;background:rgba(255,255,255,0.05);border-radius:8px;font-size:0.85rem">${c.title || ''}</span>`
                    ).join('');
                    return `
                        <div class="anim-cascade">
                            <div class="slide-type-badge anim-badge">${s.type}</div>
                            <h2 class="anim-title">${s.title || ''}</h2>
                            <div class="anim-subtitle" style="margin-top:1rem;display:flex;flex-wrap:wrap;justify-content:center">${cardTitles}</div>
                        </div>
                    `;

                case 'modal-cards':
                    const frontTitles = (s.cards || []).map((c, i) => 
                        `<span style="opacity:0;animation:slideUp 0.4s ease ${0.3 + i*0.15}s forwards;display:inline-block;margin:0.3rem;padding:0.4rem 1rem;background:rgba(99,102,241,0.1);border:1px solid rgba(99,102,241,0.2);border-radius:10px;font-size:0.9rem">${c.front || c.title || ''}</span>`
                    ).join('');
                    return `
                        <div class="anim-cascade">
                            <div class="slide-type-badge anim-badge">Interaktiv</div>
                            <h2 class="anim-title">${s.title || ''}</h2>
                            <div class="anim-subtitle" style="margin-top:1rem;display:flex;flex-wrap:wrap;justify-content:center">${frontTitles}</div>
                        </div>
                    `;

                default:
                    const title = s.title || s.name || s.value || '';
                    return `
                        <div class="anim-cascade">
                            <div class="slide-type-badge anim-badge">${s.type || 'slide'}</div>
                            <h2 class="anim-title">${title}</h2>
                            ${s.subtitle ? `<div class="slide-subtitle anim-subtitle">${s.subtitle}</div>` : ''}
                            ${s.label ? `<div class="slide-subtitle anim-subtitle">${s.label}</div>` : ''}
                        </div>
                    `;
            }
        }

        function updateMeta(meta) {
            if (meta.title) {
                document.getElementById('presentationTitle').textContent = meta.title;
                document.title = `SlideCast — ${meta.title}`;
            }
        }

        // ===== POLL SYSTEM =====
        function showPoll(data) {
            const area = document.getElementById('pollArea');
            const question = document.getElementById('pollQuestion');
            const options = document.getElementById('pollOptions');

            question.textContent = data.question;
            options.innerHTML = data.options.map((opt, i) => `
                <div class="poll-option" onclick="votePoll('${data.id}', ${i}, this)">
                    <span class="option-letter">${String.fromCharCode(65 + i)}</span>
                    <span>${opt}</span>
                </div>
            `).join('');

            area.classList.add('active');
        }

        function hidePoll() {
            document.getElementById('pollArea').classList.remove('active');
        }

        function votePoll(pollId, optionIndex, el) {
            // Visual feedback
            document.querySelectorAll('.poll-option').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');

            // Send vote
            sendToRelay({
                type: 'vote',
                pollId: pollId,
                option: optionIndex
            });
        }

        // ===== QUESTION SYSTEM =====
        function submitQuestion(e) {
            e.preventDefault();
            const input = document.getElementById('questionInput');
            const btn = document.getElementById('questionBtn');
            const text = input.value.trim();
            
            if (!text) return;

            sendToRelay({
                type: 'question',
                text: text,
                timestamp: new Date().toISOString()
            });

            // Visual feedback
            btn.textContent = '✓ Skickad!';
            btn.classList.add('sent');
            input.value = '';

            setTimeout(() => {
                btn.textContent = 'Skicka';
                btn.classList.remove('sent');
            }, 2000);
        }

        function sendToRelay(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            } else {
                // HTTP fallback
                fetch(CONFIG.relayUrl + '/message/' + CONFIG.roomId, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(() => {});
            }
        }

        // ===== DEMO MODE =====
        // If no relay specified, show demo content for testing
        function startDemo() {
            document.getElementById('presentationTitle').textContent = 'SlideCast Demo';
            updateConnectionState('connected');

            const demoSlides = [
                { type: 'title', title: 'AI & Elevhälsa', subtitle: 'Möjligheter och risker', index: 0, total: 3 },
                { type: 'stat', value: '56%', label: 'av OECD-lärare har aldrig fått AI-utbildning', index: 1, total: 3 },
                { type: 'quote', text: 'Vi riskerar att byta ut *äkta närvaro* mot effektiv simulering.', author: 'Sherry Turkle', index: 2, total: 3 }
            ];

            let i = 0;
            function showNext() {
                renderSlide({ ...demoSlides[i], slide: demoSlides[i] });
                i = (i + 1) % demoSlides.length;
            }

            showNext();
            setInterval(showNext, 5000);
        }

        // Init
        const urlParams = new URLSearchParams(window.location.search);
        const hasRoomParam = urlParams.has('room');
        const hasCodeParam = urlParams.has('code');

        // Room code join logic
        function joinWithCode() {
            const input = document.getElementById('joinCodeInput');
            const code = input.value.trim().toUpperCase();
            const errorEl = document.getElementById('joinError');
            
            if (!code || code.length < 2) {
                errorEl.textContent = 'Ange en giltig kod';
                input.focus();
                return;
            }

            errorEl.textContent = '';
            // The code IS the room ID
            CONFIG.roomId = code;
            CONFIG.relayUrl = urlParams.get('relay') || window.location.origin;

            document.getElementById('presentationTitle').textContent = 'Ansluter...';
            document.getElementById('joinScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('joinScreen').style.display = 'none';
            }, 500);

            connect();
        }
        window.joinWithCode = joinWithCode;

        function skipJoinScreen() {
            document.getElementById('joinScreen').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('joinScreen').style.display = 'none';
            }, 500);
            init();
        }
        window.skipJoinScreen = skipJoinScreen;

        // Enter key on code input
        document.addEventListener('DOMContentLoaded', () => {
            const codeInput = document.getElementById('joinCodeInput');
            if (codeInput) {
                codeInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        joinWithCode();
                    }
                });
            }
        });

        if (urlParams.get('demo') === 'true') {
            // Demo mode — skip join screen
            document.getElementById('joinScreen').style.display = 'none';
            document.addEventListener('DOMContentLoaded', startDemo);
        } else if (hasRoomParam || hasCodeParam) {
            // Direct link with room/code — skip join screen
            if (hasCodeParam) {
                // ?code=BJÖRN maps to room=BJÖRN
                const directCode = urlParams.get('code').toUpperCase();
                urlParams.set('room', directCode);
            }
            document.getElementById('joinScreen').style.display = 'none';
            document.addEventListener('DOMContentLoaded', init);
        } else {
            // No room specified — show join screen
            // Join screen is visible by default
        }
    </script>
</body>
</html>
