<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideHub — Håkans Presentationer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Ljus Nautilus-Estetik */
            --bg: #faf8f5;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --accent: #0284c7; /* Marinblå/Cyan-accent */
            --border: #e2e8f0;
            --card-bg: #f8fafc;
            --card-hover: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        header h1 span {
            color: var(--accent);
            font-style: italic;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .category-section {
            margin-bottom: 3rem;
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .category-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .presentation-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .presentation-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: var(--card-hover);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            flex: 1;
        }

        .card-meta {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Slide<span>Hub</span></h1>
        <p>Gemensamt nav för gAIa's SlideCraft-presentationer</p>
    </header>

    <main>
        <!-- Kategori: Biologi -->
        <section class="category-section">
            <h2 class="category-title">🧬 Biologi</h2>
            <div class="grid">
                <a href="presentations/fotosyntes/shell.html" class="presentation-card">
                    <div class="card-title">Fotosyntesen & Livets Byggstenar</div>
                    <div class="card-desc">Hur solljus omvandlas till kolhydrater, proteiner och fetter i ekosystemet.</div>
                    <div class="card-meta">16 Slides • Interaktiv</div>
                </a>
            </div>
        </section>

        <!-- Kategori: Kemi (Placeholder för framtiden) -->
        <section class="category-section">
            <h2 class="category-title">🧪 Kemi</h2>
            <div class="grid">
                <!-- Nya presentationer hamnar här -->
            </div>
        </section>

        <!-- Kategori: Pedagogik & Metodik (Placeholder för framtiden) -->
        <section class="category-section">
            <h2 class="category-title">📚 Pedagogik & Metodik</h2>
            <div class="grid">
                <!-- Nya presentationer hamnar här -->
            </div>
        </section>
    </main>

</body>
</html>
